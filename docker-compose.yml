# Runs the whole app locally: PostgreSQL, the API and the web app.
#   1. cp backend/.env.example backend/.env  (and fill it in)
#   2. docker compose up --build
#   3. open http://localhost:5173
# Code changes reload automatically (the source folders are mounted).

services:
  db:
    image: postgres:17-alpine
    # Use the same database name/user/password as backend/.env
    env_file: backend/.env
    entrypoint:
      - sh
      - -c
      - export POSTGRES_USER="$$USER_NAME" POSTGRES_PASSWORD="$$PASSWORD" POSTGRES_DB="$$DB_NAME"; exec docker-entrypoint.sh postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$USER_NAME\" -d \"$$DB_NAME\""]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: backend/.env
    environment:
      HOST: db
      PORT: "8080"
      CORS: http://localhost:5173
    command: npx nodemon server.js
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_BACK_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
